# package metadata, dependencies, test settings
##################################################

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofchain"
version = "0.1.0"
description = "Content-authenticity blockchain: sign and anchor file hashes, verify them later"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mrbacco", email = "mrbacco04@gmail.com" }]
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
images = ["Pillow>=10"]  # perceptual hashes for images in the CLI
dev = ["pytest>=8", "Pillow>=10"]

[project.scripts]
proofchain = "proofchain.cli:main"

[tool.setuptools]
packages = ["proofchain"]

[tool.setuptools.package-data]
proofchain = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
